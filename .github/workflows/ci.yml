name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository. No job needs a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs (tag shown in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t cursor-proxy-api .
      - name: Container runs as non-root and starts
        run: |
          test "$(docker run --rm --entrypoint id cursor-proxy-api -u)" != "0"
          docker run --rm --entrypoint sh cursor-proxy-api -c 'touch /app/data/.w && touch /home/node/.cursor/.w'
